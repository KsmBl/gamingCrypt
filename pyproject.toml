[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamingcrypt"
version = "0.1.0"
description = "Fullscreen touch UI for Linux gaming handhelds with a VeraCrypt-encrypted game drive"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.5", "requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-qt>=4"]

[project.scripts]
gamingcrypt = "gamingcrypt.app:main"

[tool.setuptools.packages.find]
include = ["gamingcrypt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
